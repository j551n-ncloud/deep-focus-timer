stages:
  - deploy

deploy:
  stage: deploy
  script:
    - |
      if [ ! -d "/home/gitlab-runner/ankiweb/.git" ]; then
        git clone https://gitlab.j551n.com/j551n/clockout_clone.git /home/gitlab-runner/clockout_clone
      else
        cd /home/gitlab-runner/clockout_clone && git pull origin main
      fi
    - cd /home/gitlab-runner/clockout_clone
    - docker compose stop calendar-app || true  # Stop the service if running
    - docker compose up --build -d
  only:
    - main
    - shared