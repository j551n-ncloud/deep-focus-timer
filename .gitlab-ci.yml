stages:
  - deploy

variables:
  APP_DIR: /home/gitlab-runner/deep-focus-timer
  OLD_DIR: /home/gitlab-runner/clockout_clone

deploy:
  stage: deploy
  script:
    # One-time move from the old repo name: stop the old stack so it frees
    # port 3000, then drop its checkout.
    - |
      if [ -d "$OLD_DIR" ]; then
        (cd "$OLD_DIR" && docker compose down) || true
        rm -rf "$OLD_DIR"
      fi
    - |
      if [ ! -d "$APP_DIR/.git" ]; then
        git clone https://gitlab.j551n.com/j551n/deep-focus-timer.git "$APP_DIR"
      else
        git -C "$APP_DIR" pull origin main
      fi
    - cd "$APP_DIR"
    - docker compose up --build -d calendar-app
  only:
    - main
    - shared
